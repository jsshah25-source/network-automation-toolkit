name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest with coverage)
        run: pytest --cov=netauto --cov-report=term-missing

  reports:
    name: Generate demo reports
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Health report from sample Meraki data
        run: netauto inventory --offline -o health-report.md
      - name: Compliance report for sample configs
        run: netauto compliance samples/configs/*.cfg -o compliance-report.md
      - name: Publish reports to the run summary
        run: cat health-report.md compliance-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: network-reports
          path: "*-report.md"
