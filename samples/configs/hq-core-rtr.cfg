hostname hq-core-rtr
!
service password-encryption
enable secret 9 $9$examplehashonly
!
aaa new-model
aaa authentication login default group tacacs+ local
!
ip ssh version 2
no ip http server
no ip http secure-server
!
ntp server 10.10.0.50
logging host 10.10.0.60
snmp-server community N3tMon-RO RO
!
banner login ^C
Authorized access only. Activity is monitored.
^C
!
line vty 0 4
 transport input ssh
line vty 5 15
 transport input ssh
!
end
